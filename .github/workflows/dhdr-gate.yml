name: dhdr decision gate

# The certificate belongs where the merge decision is made, not in a terminal
# someone ran once. This workflow puts it there.
#
# Note honestly what runs where. Producing a certificate requires a live DataHub
# to read revisions from, and a hosted runner has none. So:
#
#   - if DATAHUB_GMS_URL is configured (a self-hosted runner with reach to an
#     instance), the certificate is generated fresh in CI;
#   - otherwise the workflow uploads `examples/decision.sarif.json`, which was
#     produced by `python -m dhdr.cli sarif` against a live DataHub Core
#     v1.5.0.6 and committed as a fixture.
#
# Either way the annotation you see on the pull request is a real certificate
# from a real decision. What the fallback does not prove is that CI reached
# DataHub — only that the certificate arrives where it is useful.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # Runs before the certificate is produced, and needs no DataHub. If the
      # refusal has stopped holding, the certificate this workflow uploads is
      # not worth looking at, so there is no point generating it.
      - name: Negative control (the refusal must still hold)
        run: python scripts/negative_control.py

      # A code host renders a code-scanning result inline only when it sits on a
      # line the diff touches. Anywhere else and the certificate is filed in a
      # tab the reviewer never opens, which defeats the point of putting it here.
      - name: Locate the line under decision
        id: line
        run: |
          n=$(awk '/^SELECT$/{s=1;next} s&&/promo_code/{print NR; exit}' pipelines/orders.sql)
          test -n "$n" || { echo "promo_code is not selected; nothing to annotate"; exit 1; }
          echo "line=$n" >> "$GITHUB_OUTPUT"

      - name: Produce the certificate
        env:
          DATAHUB_GMS_URL: ${{ vars.DATAHUB_GMS_URL }}
          LINE: ${{ steps.line.outputs.line }}
        run: |
          if [ -n "$DATAHUB_GMS_URL" ]; then
            echo "Generating a certificate against $DATAHUB_GMS_URL"
            python -m dhdr.cli sarif --path pipelines/orders.sql --line "$LINE" > dhdr.sarif
          else
            echo "No DATAHUB_GMS_URL configured; uploading the committed certificate."
            echo "See examples/demo-transcript.txt for the run that produced it."
            python - "$LINE" <<'PY'
          import json, sys
          doc = json.load(open("examples/decision.sarif.json"))
          # Re-point the committed certificate at this branch's line. The content
          # of the decision is unchanged; only where the annotation lands moves.
          for result in doc["runs"][0]["results"]:
              result["locations"][0]["physicalLocation"]["region"]["startLine"] = int(sys.argv[1])
          json.dump(doc, open("dhdr.sarif", "w"), indent=2)
          PY
          fi
          python -c "import json,sys; d=json.load(open('dhdr.sarif')); r=d['runs'][0]['results'][0]; print('level:', r['level']); print(r['message']['text'])"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dhdr.sarif
          category: dhdr
