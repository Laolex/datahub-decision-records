[project]
name = "dhdr"
version = "0.1.0"
description = "Decision records for DataHub agents: bind every context read to the metadata revision that justified it"
requires-python = ">=3.11"
dependencies = ["reckon-rcdr>=0.1.1", "requests>=2.31"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
dhdr = "dhdr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a live DataHub at localhost:8080"]
